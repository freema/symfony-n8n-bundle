services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Core services
  n8n.uuid_generator:
    class: Freema\N8nBundle\Service\UuidGenerator
    public: false

  # Arguments are set by N8nExtension (tracking.cache_pool)
  n8n.request_tracker:
    class: Freema\N8nBundle\Service\RequestTracker
    public: false

  n8n.response_handler_registry:
    class: Freema\N8nBundle\Service\ResponseHandlerRegistry
    arguments:
      - !tagged_iterator n8n.response_handler
    public: false

  # Argument 0 is callback.secret (set by N8nExtension); null reads
  # kernel.secret from the parameter bag when a callback is signed.
  n8n.callback_signer:
    class: Freema\N8nBundle\Service\CallbackSigner
    arguments:
      - null
      - '%n8n.tracking.max_request_age_seconds%'
      - '@parameter_bag'
    public: false

  n8n.response_mapper:
    class: Freema\N8nBundle\Service\ResponseMapper
    public: false

  n8n.callback_handler:
    class: Freema\N8nBundle\Service\CallbackHandler
    arguments:
      - '@n8n.request_tracker'
      - '@event_dispatcher'
      - '@logger'
    public: false

  # Controllers
  Freema\N8nBundle\Controller\N8nCallbackController:
    arguments:
      - '@n8n.callback_handler'
      - '@logger'
      - '@n8n.callback_signer'
      - '@n8n.request_tracker'
      - '%n8n.callback.require_signature%'
    tags:
      - { name: 'controller.service_arguments' }

  # Event listeners
  n8n.logging_listener:
    class: Freema\N8nBundle\EventListener\N8nLoggingListener
    arguments:
      - '@logger'
    tags:
      - { name: 'kernel.event_subscriber' }

  # Cleanup command
  n8n.cleanup_command:
    class: Freema\N8nBundle\Command\CleanupCommand
    arguments:
      - '@n8n.request_tracker'
      - '%n8n.tracking.max_request_age_seconds%'
    tags:
      - { name: 'console.command' }

  # Interface aliases
  Freema\N8nBundle\Contract\N8nClientInterface: '@n8n.client'